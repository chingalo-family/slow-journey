name: slowjourney
description: "A calm daily rhythm - set intentions, reflect, and grow."
publish_to: "none"
version: 1.0.1+2

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  drift: ^2.28.1
  sqlite3_flutter_libs: ^0.5.39
  sqlite3: ^2.9.0
  path_provider: ^2.1.5
  path: ^1.9.1
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  image_picker: ^1.2.0
  flutter_local_notifications: ^19.4.2
  timezone: ^0.10.1
  flutter_timezone: ^4.1.1
  flutter_dotenv: ^6.0.0
  flutter_svg: ^2.2.0
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.2
  build_runner: ^2.4.15
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app_icon.png
  adaptive_icon_background: "#F4F1EA"
  adaptive_icon_foreground: assets/brand/app_icon.png
  remove_alpha_ios: true

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    - assets/brand/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
