name: Bug report
description: Report a reproducible problem in Slow Journey
title: "[bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for a report. For vulnerabilities, do **not** use this form - see [SECURITY.md](https://github.com/chingalo-family/slow-journey/blob/develop/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected vs what you saw.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Planner
        2. …
        3. …
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: Level
      description: How this report should be classified.
      options:
        - Bug
        - Feature
        - Additional
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Onboarding / PIN
        - Intentions / Planner
        - Evening reflection
        - Journey feed
        - Growth
        - Setup / reminders / theme
        - Notifications
        - Offline storage
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: From `pubspec.yaml` (currently `1.0.0+1`) or a git SHA.
      placeholder: 1.0.0+1
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Android
        - iOS
        - Both
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS version, device or emulator, and `flutter doctor -v` if you can run it.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Analyzer output, test failure, or a screenshot. Avoid sharing reflections or PIN values.
    validations:
      required: false
